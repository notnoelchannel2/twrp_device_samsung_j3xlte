name: OrangeFox Recovery (SM-J320FN/F/G/M)

on:
  workflow_dispatch:

jobs:
  build:
    name: OFRP Build CI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v5
    - name: Installing Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository ppa:deadsnakes/ppa
        sudo add-apt-repository universe
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex axel g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb && sudo dpkg -i libtinfo5_6.3-2_amd64.deb && rm -f libtinfo5_6.3-2_amd64.deb
        wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb && sudo dpkg -i libncurses5_6.3-2_amd64.deb && rm -f libncurses5_6.3-2_amd64.deb
    - name: Install OpenJDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'
    - name: Syncing OFRP sources
      run: |
        mkdir ~/OFRP
        cd ~/OFRP
        mkdir ~/.bin
        curl http://commondatastorage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        python3 ~/.bin/repo init --depth=1 -u https://github.com/unlegacy-devices/fox-7.1_manifest -b twrp-7.1
        git clone https://github.com/j3xlte-dev/android_kernel_j2xlte ~/OFRP/kernel/samsung/sharkls
        git clone --branch twrp-6.0 --single-branch https://github.com/NotNoelChannel/twrp_device_samsung_j3xnlte.git ~/OFRP/device/samsung/j3xlte
        python3 ~/.bin/repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j$(nproc --all)
    - name: Building OrangeFox
      run: |
        OLDPATH=$PATH
        OLDJAVAHOME=$JAVA_HOME
        export PATH="$HOME/.jdk_7/java-se-7u75-ri/bin:$PATH"
        export JAVA_HOME="$HOME/.jdk_7/java-se-7u75-ri"
        cd ~/OFRP
        sudo git clone --depth 1 --branch android-7.1.2_r37 --single-branch https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.8 /opt/toolchains/arm-eabi-4.8/
        source build/envsetup.sh
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export OF_USE_GREEN_LED=0
        export FOX_RECOVERY_SYSTEM_PARTITION="/dev/block/platform/sdio_emmc/by-name/SYSTEM"
        export FOX_RECOVERY_BOOT_PARTITION="/dev/block/platform/sdio_emmc/by-name/KERNEL"
        export FOX_RECOVERY_INSTALL_PARTITION="/dev/block/platform/sdio_emmc/by-name/RECOVERY"
        export OF_FL_PATH1="/flashlight"
        export OF_LEGACY_SHAR512=1
        export OF_DISABLE_KEYMASTER2=1
        export OF_MAINTAINER="notnoelchannel"
        export TARGET_ARCH="arm"
        export FOX_BUILD_TYPE="Beta"
        lunch omni_j3xlte-eng
        make -j$(nproc --all) recoveryimage
        export PATH=$OLDPATH
        export JAVA_HOME=$OLDJAVAHOME
    - name: Uploading OFRP builds
      uses: actions/upload-artifact@v6
      with:
        name: ofrp
        path: | 
          /home/runner/OFRP/out/target/product/j3xlte/recovery.*
          /home/runner/OFRP/out/target/product/j3xlte/OrangeFox-*.zip
